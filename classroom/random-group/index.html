<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모둠 구성 도우미 — 과학 도구상자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="../../toolbox-nav.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
    :root {
      --bg:        #F5F3FF;
      --surface:   #FFFFFF;
      --surface-2: #FAFAFA;
      --border:    #E4E0F5;
      --border2:   #C4BAE8;
      --accent:    #6D28D9;
      --accent-dk: #5B21B6;
      --accent-lt: #EDE9FE;
      --text:      #1E1B33;
      --muted:     #6B6888;
      --subtle:    #9B98B8;
      --radius:    12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .page { max-width: 960px; margin: 0 auto; padding: 4rem 1.5rem 3rem; }

    /* ── 헤더 ── */
    .header { margin-bottom: 2rem; }
    .badge {
      display: inline-block;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-lt);
      padding: .3rem .75rem;
      border-radius: 999px;
      margin-bottom: .85rem;
    }
    .page-title {
      font-family: 'Gowun Batang', serif;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: .45rem;
    }
    .page-desc { font-size: .97rem; color: var(--muted); line-height: 1.6; }

    /* ── 패널 ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem 1.5rem;
      margin-bottom: 1rem;
    }
    .panel-title {
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .9rem;
    }

    /* ── 이름 입력 ── */
    #names {
      width: 100%;
      height: 140px;
      padding: .8rem 1rem;
      font-family: inherit;
      font-size: .95rem;
      line-height: 1.7;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      resize: vertical;
      transition: border-color .15s;
    }
    #names:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,40,217,.1); }
    #names::placeholder { color: var(--subtle); }
    .names-hint { font-size: .82rem; color: var(--subtle); margin-top: .55rem; }
    .names-hint strong { color: var(--accent); font-weight: 600; }

    /* ── 모둠 수 설정 ── */
    .group-count-row { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
    .num-stepper {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: .3rem;
    }
    .step-btn {
      width: 36px; height: 36px;
      border: none; background: transparent;
      font-size: 1.3rem; font-weight: 600;
      color: var(--muted); cursor: pointer;
      border-radius: 6px;
      transition: background .15s, color .15s;
    }
    .step-btn:hover:not(:disabled) { background: var(--accent-lt); color: var(--accent); }
    .step-btn:active:not(:disabled) { transform: scale(.94); }
    .step-btn:disabled { opacity: .35; cursor: not-allowed; }
    .num-value {
      min-width: 44px; text-align: center;
      font-size: 1.15rem; font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .num-hint { font-size: .88rem; color: var(--muted); }

    /* ── 버튼 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .68rem 1.4rem;
      font-family: inherit;
      font-size: .94rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-dk); }
    .btn-primary:active:not(:disabled) { transform: scale(.97); }
    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--muted);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .build-btn-row { margin-top: 1.1rem; }

    /* ── 대기 영역 ── */
    .pool-section {
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px dashed var(--border);
    }
    .pool-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: .65rem;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .pool-label {
      font-size: .85rem;
      font-weight: 600;
      color: var(--muted);
    }
    .pool-label .count { color: var(--accent); font-weight: 700; }
    .pool-hint { font-size: .78rem; color: var(--subtle); }

    #pool {
      background: var(--surface-2);
      border: 1.5px dashed var(--border2);
      border-radius: 10px;
      padding: 12px;
      min-height: 76px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }
    #pool.dragover { border-color: var(--accent); background: var(--accent-lt); }
    #pool .empty-msg {
      width: 100%;
      text-align: center;
      color: var(--subtle);
      font-size: .85rem;
      padding: .65rem 0;
    }

    /* ── 이름 칩 ── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: .4rem .75rem;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      font-size: .9rem;
      color: var(--text);
      cursor: grab;
      user-select: none;
      transition: transform .12s, box-shadow .12s, border-color .12s;
    }
    .chip:hover { border-color: var(--accent); box-shadow: 0 2px 6px rgba(109,40,217,.12); }
    .chip:active { cursor: grabbing; }
    .chip.is-manual {
      background: var(--g-light, var(--accent-lt));
      border-color: var(--g-color, var(--accent));
      color: var(--g-color, var(--accent));
      font-weight: 600;
    }
    .chip.is-auto {
      background: var(--g-light, var(--accent-lt));
      border-color: transparent;
      color: var(--g-dark, var(--accent-dk));
    }
    .chip .pin {
      font-size: .7rem;
      opacity: .7;
    }

    /* Sortable 드래그 중 스타일 */
    .sortable-ghost { opacity: .35; }
    .sortable-drag { box-shadow: 0 6px 16px rgba(0,0,0,.15); transform: rotate(-2deg); }
    .sortable-chosen { cursor: grabbing; }

    /* ── 모둠 카드 그리드 ── */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: .85rem;
    }
    .group-card {
      background: var(--surface);
      border: 1.5px solid var(--g-border, var(--border));
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 130px;
    }
    .group-card.dragover { border-color: var(--g-color, var(--accent)); border-style: solid; }
    .group-header {
      background: var(--g-color, var(--accent));
      color: white;
      padding: .55rem 1rem;
      font-size: .9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .group-count {
      font-size: .75rem;
      font-weight: 500;
      opacity: .8;
    }
    .group-body {
      padding: .65rem .75rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-height: 70px;
    }
    .group-body .empty-drop {
      text-align: center;
      color: var(--subtle);
      font-size: .8rem;
      margin: auto 0;
      padding: .35rem 0;
    }

    /* ── 액션 ── */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem;
      margin-top: 1.25rem;
    }

    /* ── 토스트 ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--text);
      color: white;
      padding: .65rem 1.2rem;
      border-radius: 999px;
      font-size: .88rem;
      font-weight: 500;
      opacity: 0;
      transition: transform .25s, opacity .25s;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── 모바일 ── */
    @media (max-width: 540px) {
      .page { padding: 3.5rem 1rem 2.5rem; }
      .panel { padding: 1.1rem 1.1rem; }
      .groups-grid { grid-template-columns: 1fr 1fr; gap: .6rem; }
      .group-card { min-height: 110px; }
      .group-header { padding: .5rem .75rem; font-size: .85rem; }
      .group-body { padding: .55rem .6rem; }
      .chip { font-size: .85rem; padding: .35rem .65rem; }
    }

    /* ── 인쇄 스타일 ── */
    @media print {
      body { background: white; }
      .page { padding: 1rem; }
      .header .badge, .panel:not(.work-panel), .actions, .toolbox-back-link { display: none !important; }
      .pool-section { display: none; }
      .work-panel { border: none; padding: 0; }
      .panel-title { display: none; }
      .groups-grid { grid-template-columns: repeat(3, 1fr); gap: .5rem; }
      .group-card { border: 1px solid #ccc !important; break-inside: avoid; min-height: auto; }
      .group-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .chip { background: #f5f5f5 !important; border-color: #ddd !important; color: #333 !important; }
    }
  
/* ============================================================
   과학 도구상자 · 도구 공통 틀 v1.1
   - 모든 도구가 같은 머리말·탭·버튼·글꼴·화면 폭을 쓰도록 맞춘 부분입니다.
   - 도구마다 바꾸는 값은 맨 위 --cat(분야 색) 하나뿐입니다.
   - 이 블록(공통 틀 시작~끝)은 도구끼리 똑같이 복사해 씁니다.
     도구만의 디자인은 "공통 틀 끝" 아래에 따로 적습니다.
   ============================================================ */
:root {
  /* 분야 색: 물리 #1D4ED8 · 화학 #B45309 · 생명 #15803D · 지구 #78350F · 메이커 #BE123C · 공통 #57534E · 학급 #6D28D9 */
  --cat: #6D28D9;   /* 학급 운영 */
  --cat-soft: color-mix(in srgb, var(--cat) 9%, var(--sheet));

  --paper:    #F6F2E7;
  --sheet:    #FFFDF7;
  --ink:      #24211D;
  --graphite: #5C564E;
  --hairline: #D9D1BF;
  --rule:     rgba(64, 106, 168, 0.11);
  --focus:    #1D4ED8;

  --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', system-ui, sans-serif;
  --font-display: 'Gowun Batang', 'Pretendard', serif;
  --radius: 4px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(to bottom, transparent calc(2rem - 1px), var(--rule) calc(2rem - 1px));
  background-size: 100% 2rem;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* 화면 폭: 홈페이지와 같은 1200px. 위쪽 여백은 "← 도구상자" 링크 자리 */
.tb-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 4.25rem 1.5rem 3rem;
}

/* ----- 머리말: 분야·학년·활동 → 제목 → 한 줄 설명 ----- */
.tb-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 1.1rem;
  align-items: center;
  padding-bottom: 1.25rem;
  margin-bottom: 1.25rem;
  border-bottom: 1.5px solid var(--ink);
}
.tb-emblem {
  grid-row: 1 / span 3;
  align-self: start;
  display: grid;
  place-items: center;
  width: 4.25rem;
  height: 4.25rem;
  margin-top: .2rem;
  border: 1.5px solid var(--ink);
  border-top: 6px solid var(--cat);
  border-radius: var(--radius);
  background: var(--cat-soft);
  color: var(--cat);
  box-shadow: 4px 4px 0 color-mix(in srgb, var(--cat) 28%, transparent);
}
.tb-emblem svg { width: 2.6rem; height: 2.6rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .3rem .9rem;
  margin: 0;
  font-size: .9rem;
  font-weight: 600;
  color: var(--graphite);
}
.tb-meta .tb-cat {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  color: var(--cat);
  font-weight: 700;
}
.tb-meta .tb-cat svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb-title {
  margin: .15rem 0 .3rem;
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 4.2vw, 2.6rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  word-break: keep-all;
}
.tb-lead {
  margin: 0;
  font-size: 1.02rem;
  color: var(--graphite);
  word-break: keep-all;
}
.tb-lead b, .tb-lead strong { color: var(--ink); }

/* ----- 교사용 정보: 학생 화면에서는 접혀 있음 ----- */
.tb-teacher {
  margin: 0 0 1.25rem;
  border: 1.5px dashed var(--graphite);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--ink) 3%, var(--paper));
}
.tb-teacher > summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4rem .8rem;
  padding: .6rem .9rem;
  cursor: pointer;
  font-weight: 700;
  font-size: .95rem;
  list-style: none;
}
.tb-teacher > summary::-webkit-details-marker { display: none; }
.tb-teacher > summary::before {
  content: '';
  width: .55rem; height: .55rem;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(-45deg);
  transition: transform .3s var(--ease);
}
.tb-teacher[open] > summary::before { transform: rotate(45deg); }
.tb-teacher > summary .tb-hint { font-weight: 500; color: var(--graphite); font-size: .88rem; }
.tb-teacher-body { max-width: 62rem; padding: 0 1rem 1rem; font-size: .95rem; word-break: keep-all; }
.tb-teacher-body ul { margin: .4rem 0 0; padding-left: 1.2rem; }
.tb-teacher-body li { margin-bottom: .4rem; }
.tb-std {
  display: inline-block;
  padding: .05rem .5rem;
  font-weight: 700;
  font-size: .9rem;
  color: var(--cat);
  border: 1.5px solid var(--cat);
  border-radius: 3px;
  background: var(--sheet);
  white-space: nowrap;
}

/* ----- 도구 전체에 걸리는 조작(교사용 보기, 인쇄 등) 한 줄 ----- */
.tb-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .6rem 1.2rem;
  margin: 0 0 1.1rem;
}
/* 켜고 끄는 스위치 — 홈페이지의 '교사용 정보' 스위치와 같은 모양 */
.tb-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  min-height: 40px;
  font-size: .95rem;
  font-weight: 600;
  color: var(--graphite);
  cursor: pointer;
  user-select: none;
}
.tb-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.tb-switch .tb-track {
  position: relative;
  flex-shrink: 0;
  width: 38px;
  height: 22px;
  border: 1.5px solid var(--graphite);
  border-radius: 999px;
  background: var(--sheet);
  transition: background-color .3s var(--ease), border-color .3s var(--ease);
}
.tb-switch .tb-track::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--graphite);
  transition: transform .3s var(--ease), background-color .3s var(--ease);
}
.tb-switch input:checked + .tb-track { background: var(--ink); border-color: var(--ink); }
.tb-switch input:checked + .tb-track::after { transform: translateX(16px); background: var(--paper); }
.tb-switch:has(input:checked) { color: var(--ink); }
.tb-switch input:focus-visible + .tb-track { outline: 3px solid var(--focus); outline-offset: 3px; }

/* ----- 화면 바꾸기 탭: 한 덩어리 버튼 묶음 ----- */
.tb-tabs {
  display: inline-flex;
  flex-wrap: wrap;
  margin: 0 0 1rem;
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--sheet);
}
.tb-tabs > button {
  margin: 0;
  border-radius: 0;
  box-shadow: none;
  font: inherit;
  font-size: .98rem;
  min-height: 44px;
  padding: .5rem 1.1rem;
  border: 0;
  border-left: 1px solid var(--hairline);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background-color .3s var(--ease), color .3s var(--ease);
}
.tb-tabs > button:first-child { border-left: 0; }
.tb-tabs > button:hover { background: color-mix(in srgb, var(--ink) 7%, var(--sheet)); }
.tb-tabs > button[aria-selected="true"],
.tb-tabs > button.active { background: var(--ink); color: var(--paper); font-weight: 700; }
.tb-tabs > button:focus-visible { outline-offset: -4px; }

/* ----- 실험 무대(그림·캔버스가 들어가는 틀) ----- */
.tb-stage {
  position: relative;
  background: var(--sheet);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  box-shadow: 5px 5px 0 color-mix(in srgb, var(--cat) 26%, transparent);
  overflow: hidden;
}

/* ----- 조작판(버튼·슬라이더가 모인 곳) ----- */
.tb-panel {
  background: var(--sheet);
  border: 1.5px solid var(--hairline);
  border-radius: var(--radius);
  padding: 1rem;
}
.tb-panel-title {
  margin: 0 0 .7rem;
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
}

/* ----- 버튼 ----- */
.tb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  min-height: 42px;
  padding: .5rem 1rem;
  font: inherit;
  font-size: .95rem;
  font-weight: 700;
  color: var(--sheet);
  background: var(--cat);
  border: 1.5px solid var(--cat);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background-color .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease);
}
.tb-btn:hover { background: color-mix(in srgb, var(--cat) 82%, var(--ink)); }
.tb-btn.ghost, .tb-btn--ghost {
  color: var(--ink);
  background: var(--sheet);
  border-color: var(--ink);
  font-weight: 600;
}
.tb-btn.ghost:hover, .tb-btn--ghost:hover { background: var(--cat-soft); }
.tb-btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ----- 안내 상자 ----- */
.tb-note {
  margin: 0;
  padding: .8rem 1rem;
  background: var(--cat-soft);
  border-left: 5px solid var(--cat);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: .97rem;
  word-break: keep-all;
}
.tb-note b, .tb-note strong { color: color-mix(in srgb, var(--cat) 70%, var(--ink)); }

/* ----- 출처 ----- */
.tb-foot {
  margin-top: 2.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--hairline);
  font-size: .85rem;
  color: var(--graphite);
}

/* ----- 화면 크기별 ----- */
@media (max-width: 640px) {
  .tb-wrap { padding: 3.75rem 1rem 2.5rem; }
  .tb-head { column-gap: .8rem; }
  .tb-emblem { width: 3.3rem; height: 3.3rem; border-top-width: 5px; }
  .tb-emblem svg { width: 2rem; height: 2rem; }
  /* 휴대폰: 탭을 같은 폭으로 한 줄에 */
  .tb-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
  .tb-tabs > button { padding: .4rem .35rem; font-size: .88rem; line-height: 1.3; word-break: keep-all; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; animation-iteration-count: 1 !important; }
}
@media print {
  body { background: #fff; }
  .tb-wrap { padding: 0; max-width: none; }
  .tb-tabs, .tb-teacher, .tb-actions, .toolbox-back-link { display: none !important; }
  .tb-stage { box-shadow: none; break-inside: avoid; }
  .tb-emblem { box-shadow: none; }
}
/* ===== 공통 틀 끝 ===== */

/* ===== 공통 틀 맞춤: 모둠 구성 도우미 ===== */
:root { --bg: var(--paper); --surface: var(--sheet); --surface-2: var(--paper); --border: var(--hairline); --accent: var(--cat); --accent-lt: var(--cat-soft); --text: var(--ink); --muted: var(--graphite); }
.page.tb-wrap { padding-top: 4.25rem; }
.panel { border: 1.5px solid var(--hairline); }
.panel-title { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0; text-transform: none; color: var(--ink); }
/* 모둠 배치 칸이 이 도구의 무대 */
.work-panel { border: 1.5px solid var(--ink); box-shadow: 5px 5px 0 color-mix(in srgb, var(--cat) 26%, transparent); }
.btn { border-radius: var(--radius); min-height: 42px; }
.btn-ghost { color: var(--ink); background: var(--sheet); border: 1.5px solid var(--ink); }
.btn-ghost:hover { background: var(--cat-soft); }
textarea { border-radius: var(--radius); }
/* 넓은 화면: ① 이름 입력과 ② 모둠 수를 나란히 */
@media (min-width: 1000px) {
  .page.tb-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; column-gap: 1rem; align-items: start; }
  .page.tb-wrap > * { grid-column: 1 / -1; }
  .page.tb-wrap > div.panel:nth-of-type(1) { grid-column: 1; }
  .page.tb-wrap > div.panel:nth-of-type(2) { grid-column: 2; }
}
</style>
</head>
<body>
<div class="page tb-wrap">
  <header class="tb-head">
    <div class="tb-emblem" aria-hidden="true">
      <svg viewBox="0 0 48 48"><rect x="4" y="6" width="17" height="15" rx="2"/><rect x="27" y="6" width="17" height="15" rx="2"/><rect x="4" y="27" width="17" height="15" rx="2"/><rect x="27" y="27" width="17" height="15" rx="2" stroke-dasharray="3 3"/><circle cx="10" cy="13.5" r="2"/><circle cx="15" cy="13.5" r="2"/><circle cx="33" cy="13.5" r="2"/><circle cx="38" cy="13.5" r="2"/><circle cx="10" cy="34.5" r="2"/><circle cx="15" cy="34.5" r="2"/></svg>
    </div>
    <p class="tb-meta">
      <span class="tb-cat"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.6 14.2A5 5 0 0 1 21 19"/></svg>학급 운영</span>
      <span>전 학년</span><span>수업 운영</span>
    </p>
    <h1 class="tb-title">모둠 구성 도우미</h1>
    <p class="tb-lead">학생 이름을 박스로 만들어 직접 끌어 옮기거나, 나머지를 무작위로 배치합니다. 미리 짝짓고 싶은 학생은 직접 모둠에 넣으세요.</p>
  </header>

  <!-- ① 이름 입력 -->
  <div class="panel">
    <div class="panel-title">① 학생 이름 입력</div>
    <textarea id="names" placeholder="이름을 한 줄에 한 명씩 입력하거나 붙여넣으세요.
예:
김민준
이서연
박도윤
최지아"></textarea>
    <p class="names-hint" id="name-count">아직 입력된 이름이 없습니다.</p>
    <div class="build-btn-row">
      <button class="btn btn-primary" id="build-btn" type="button" disabled>📝 이름 박스 만들기 →</button>
    </div>
  </div>

  <!-- ② 모둠 수 설정 -->
  <div class="panel">
    <div class="panel-title">② 모둠 수 설정</div>
    <div class="group-count-row">
      <div class="num-stepper">
        <button class="step-btn" id="dec-btn" type="button" aria-label="모둠 수 줄이기">−</button>
        <span class="num-value" id="num-value">4</span>
        <button class="step-btn" id="inc-btn" type="button" aria-label="모둠 수 늘리기">+</button>
      </div>
      <span class="num-hint" id="num-hint">총 모둠 수 (2~10 사이)</span>
    </div>
  </div>

  <!-- ③ 작업 영역 -->
  <div class="panel work-panel">
    <div class="panel-title">③ 모둠 배치 — 드래그 또는 랜덤</div>

    <div class="pool-section">
      <div class="pool-header">
        <span class="pool-label">⊟ 대기 <span class="count" id="pool-count">0</span>명</span>
        <span class="pool-hint">이름 칩을 드래그해 모둠 카드로 옮기세요</span>
      </div>
      <div id="pool"></div>
    </div>

    <div class="groups-grid" id="groups-grid"></div>
  </div>

  <!-- 액션 -->
  <div class="actions">
    <button class="btn btn-primary" id="random-btn" type="button" disabled>🎲 나머지 랜덤 배치</button>
    <button class="btn btn-ghost" id="reshuffle-btn" type="button" disabled>↺ 자동 배치만 다시 섞기</button>
    <button class="btn btn-ghost" id="copy-btn" type="button" disabled>📋 결과 복사</button>
    <button class="btn btn-ghost" id="print-btn" type="button" disabled>🖨️ 인쇄</button>
    <button class="btn btn-ghost" id="reset-btn" type="button" style="margin-left: auto;">↶ 처음부터</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── 모둠 색상 팔레트 (최대 10모둠) ──
const PALETTE = [
  { color: '#6D28D9', light: '#EDE9FE', dark: '#5B21B6' }, // 보라
  { color: '#0E7490', light: '#E0F2FE', dark: '#075985' }, // 청록
  { color: '#B45309', light: '#FEF3C7', dark: '#92400E' }, // 호박
  { color: '#15803D', light: '#DCFCE7', dark: '#166534' }, // 초록
  { color: '#BE123C', light: '#FFE4E6', dark: '#9F1239' }, // 진홍
  { color: '#1D4ED8', light: '#DBEAFE', dark: '#1E40AF' }, // 파랑
  { color: '#9333EA', light: '#F3E8FF', dark: '#7E22CE' }, // 자주
  { color: '#0891B2', light: '#CFFAFE', dark: '#0E7490' }, // 시안
  { color: '#CA8A04', light: '#FEF9C3', dark: '#A16207' }, // 머스타드
  { color: '#65A30D', light: '#ECFCCB', dark: '#4D7C0F' }  // 라임
];

// ── 상태 ──
let students  = [];   // [{ id, name, state: 'pool'|'manual'|'auto', group: number|null }]
let numGroups = 4;
let nextId    = 1;

// ── DOM 참조 ──
const namesEl       = document.getElementById('names');
const nameCountEl   = document.getElementById('name-count');
const buildBtn      = document.getElementById('build-btn');
const numValueEl    = document.getElementById('num-value');
const numHintEl     = document.getElementById('num-hint');
const decBtn        = document.getElementById('dec-btn');
const incBtn        = document.getElementById('inc-btn');
const poolEl        = document.getElementById('pool');
const poolCountEl   = document.getElementById('pool-count');
const groupsGridEl  = document.getElementById('groups-grid');
const randomBtn     = document.getElementById('random-btn');
const reshuffleBtn  = document.getElementById('reshuffle-btn');
const copyBtn       = document.getElementById('copy-btn');
const printBtn      = document.getElementById('print-btn');
const resetBtn      = document.getElementById('reset-btn');

// ── 입력 영역 ──
namesEl.addEventListener('input', updateNameCount);

function updateNameCount() {
  const parsed = parseNames();
  if (parsed.length === 0) {
    nameCountEl.textContent = '아직 입력된 이름이 없습니다.';
    buildBtn.disabled = true;
  } else {
    const groupSize = (parsed.length / numGroups);
    const small = Math.floor(groupSize);
    const big = Math.ceil(groupSize);
    const sizeHint = (small === big) ? `${small}명씩` : `약 ${small}~${big}명씩`;
    nameCountEl.innerHTML = `총 <strong>${parsed.length}명</strong> 입력됨 → ${numGroups}모둠 (${sizeHint})`;
    buildBtn.disabled = false;
  }
}

function parseNames() {
  return namesEl.value
    .split('\n')
    .map(s => s.trim())
    // 엑셀에서 복사할 때 "1\t김민준" 같은 형태도 처리
    .map(s => s.replace(/^\d+[\s\t.)\-]+/, '').trim())
    .filter(s => s.length > 0);
}

// ── 모둠 수 조절 ──
decBtn.addEventListener('click', () => changeGroups(numGroups - 1));
incBtn.addEventListener('click', () => changeGroups(numGroups + 1));

function changeGroups(newCount) {
  newCount = Math.max(2, Math.min(10, newCount));
  if (newCount === numGroups) return;

  // 줄이는 경우: 사라지는 모둠의 학생을 대기로 보냄
  if (newCount < numGroups) {
    students.forEach(s => {
      if (s.group !== null && s.group >= newCount) {
        s.state = 'pool';
        s.group = null;
      }
    });
  }

  numGroups = newCount;
  numValueEl.textContent = numGroups;
  decBtn.disabled = numGroups <= 2;
  incBtn.disabled = numGroups >= 10;

  updateNameCount();
  if (students.length > 0) render();
}

// ── 이름 박스 만들기 ──
buildBtn.addEventListener('click', () => {
  const names = parseNames();
  if (names.length === 0) return;

  // 기존 데이터가 있으면 확인 (간단히: 그냥 덮어쓰기 + 토스트로 알림)
  const hadData = students.length > 0;
  students = names.map(n => ({
    id: nextId++,
    name: n,
    state: 'pool',
    group: null
  }));

  render();
  enableActionButtons();
  if (hadData) showToast('이름 박스를 새로 만들었습니다.');
});

// ── 렌더링 ──
function render() {
  renderPool();
  renderGroups();
  updateCounts();
  updateActionButtons();
}

function renderPool() {
  poolEl.innerHTML = '';
  const poolStudents = students.filter(s => s.state === 'pool');

  if (students.length === 0) {
    poolEl.innerHTML = '<div class="empty-msg">이름을 입력한 뒤 「이름 박스 만들기」를 눌러주세요</div>';
    return;
  }
  if (poolStudents.length === 0) {
    poolEl.innerHTML = '<div class="empty-msg">대기 중인 학생이 없습니다 — 모두 모둠에 배치됨</div>';
    return;
  }

  poolStudents.forEach(s => poolEl.appendChild(makeChip(s)));
}

function renderGroups() {
  groupsGridEl.innerHTML = '';
  for (let i = 0; i < numGroups; i++) {
    const card = makeGroupCard(i);
    groupsGridEl.appendChild(card);
  }
  initGroupSortables();
}

function makeChip(student) {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.dataset.id = student.id;

  if (student.state === 'manual' && student.group !== null) {
    const c = PALETTE[student.group % PALETTE.length];
    chip.classList.add('is-manual');
    chip.style.setProperty('--g-color', c.color);
    chip.style.setProperty('--g-light', c.light);
    chip.innerHTML = `<span class="pin">📌</span>${escHtml(student.name)}`;
  } else if (student.state === 'auto' && student.group !== null) {
    const c = PALETTE[student.group % PALETTE.length];
    chip.classList.add('is-auto');
    chip.style.setProperty('--g-light', c.light);
    chip.style.setProperty('--g-dark', c.dark);
    chip.textContent = student.name;
  } else {
    chip.textContent = student.name;
  }
  return chip;
}

function makeGroupCard(idx) {
  const c = PALETTE[idx % PALETTE.length];
  const card = document.createElement('div');
  card.className = 'group-card';
  card.dataset.group = String(idx);
  card.style.setProperty('--g-color', c.color);
  card.style.setProperty('--g-light', c.light);
  card.style.setProperty('--g-dark', c.dark);
  card.style.setProperty('--g-border', c.color + '40');

  const members = students.filter(s => s.group === idx);
  card.innerHTML = `
    <div class="group-header">
      <span>${idx + 1}모둠</span>
      <span class="group-count">${members.length}명</span>
    </div>
    <div class="group-body" data-group="${idx}"></div>
  `;

  const body = card.querySelector('.group-body');
  if (members.length === 0) {
    body.innerHTML = '<div class="empty-drop">여기로 드래그</div>';
  } else {
    members.forEach(s => body.appendChild(makeChip(s)));
  }
  return card;
}

function updateCounts() {
  const poolCount = students.filter(s => s.state === 'pool').length;
  poolCountEl.textContent = poolCount;
}

function updateActionButtons() {
  const hasStudents = students.length > 0;
  const hasPool     = students.some(s => s.state === 'pool');
  const hasAssigned = students.some(s => s.group !== null);
  const hasAuto     = students.some(s => s.state === 'auto');

  randomBtn.disabled    = !hasPool;
  reshuffleBtn.disabled = !hasAuto;
  copyBtn.disabled      = !hasAssigned;
  printBtn.disabled     = !hasAssigned;
}

function enableActionButtons() {
  updateActionButtons();
}

// ── Sortable 초기화 ──
let poolSortable = null;

function initPoolSortable() {
  if (poolSortable) poolSortable.destroy();
  poolSortable = Sortable.create(poolEl, {
    group: 'students',
    animation: 150,
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    dragClass: 'sortable-drag',
    onAdd: (evt) => {
      const id = parseInt(evt.item.dataset.id);
      const student = students.find(s => s.id === id);
      if (student) {
        student.state = 'pool';
        student.group = null;
      }
      // 이동된 이름표의 모양을 새 상태에 맞게 갱신
      requestAnimationFrame(render);
    }
  });
}

function initGroupSortables() {
  groupsGridEl.querySelectorAll('.group-body').forEach(body => {
    Sortable.create(body, {
      group: 'students',
      animation: 150,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      dragClass: 'sortable-drag',
      onAdd: (evt) => {
        const id = parseInt(evt.item.dataset.id);
        const targetGroup = parseInt(evt.to.dataset.group);
        const student = students.find(s => s.id === id);
        if (student) {
          // 드래그로 모둠에 넣으면 "수동" 상태로 승격
          student.state = 'manual';
          student.group = targetGroup;
        }
        requestAnimationFrame(render);
      },
      onStart: () => {},
      onEnd: () => {}
    });
  });
}

// ── 랜덤 배치 (수정된 균등 배분 알고리즘) ──
randomBtn.addEventListener('click', () => {
  distributeRandom();
  render();
});

function distributeRandom() {
  const poolStudents = students.filter(s => s.state === 'pool');
  if (poolStudents.length === 0) return;

  const shuffled = shuffle([...poolStudents]);
  const total = students.length;

  // 핵심: baseSize 기준 + 나머지(extra)만큼만 +1
  const baseSize = Math.floor(total / numGroups);
  const extra    = total - baseSize * numGroups;
  const targetSizes = [];
  for (let i = 0; i < numGroups; i++) {
    targetSizes.push(i < extra ? baseSize + 1 : baseSize);
  }

  // 현재 각 모둠의 인원 수
  const currentSizes = Array(numGroups).fill(0);
  students.forEach(s => { if (s.group !== null) currentSizes[s.group]++; });

  // 각 모둠을 목표 인원까지 채움
  let idx = 0;
  for (let g = 0; g < numGroups; g++) {
    const needed = targetSizes[g] - currentSizes[g];
    for (let k = 0; k < needed && idx < shuffled.length; k++) {
      shuffled[idx].state = 'auto';
      shuffled[idx].group = g;
      currentSizes[g]++;
      idx++;
    }
  }

  // 그래도 남은 학생(어떤 모둠이 이미 목표 초과인 경우)은 가장 작은 모둠에 추가
  while (idx < shuffled.length) {
    let minIdx = 0;
    for (let i = 1; i < numGroups; i++) {
      if (currentSizes[i] < currentSizes[minIdx]) minIdx = i;
    }
    shuffled[idx].state = 'auto';
    shuffled[idx].group = minIdx;
    currentSizes[minIdx]++;
    idx++;
  }
}

// ── 자동 배치만 다시 섞기 ──
reshuffleBtn.addEventListener('click', () => {
  students.forEach(s => {
    if (s.state === 'auto') {
      s.state = 'pool';
      s.group = null;
    }
  });
  distributeRandom();
  render();
  showToast('자동 배치된 학생만 다시 섞었습니다.');
});

// ── 결과 복사 ──
copyBtn.addEventListener('click', () => {
  let text = '';
  for (let i = 0; i < numGroups; i++) {
    const members = students.filter(s => s.group === i);
    if (members.length === 0) continue;
    text += `[${i + 1}모둠]\n` + members.map(s => s.name).join('\n') + '\n\n';
  }
  const remaining = students.filter(s => s.state === 'pool');
  if (remaining.length > 0) {
    text += `[미배치]\n` + remaining.map(s => s.name).join('\n');
  }

  navigator.clipboard.writeText(text.trim())
    .then(() => showToast('클립보드에 복사됐습니다!'))
    .catch(() => showToast('복사 실패 — 직접 선택해 복사해주세요.'));
});

// ── 인쇄 ──
printBtn.addEventListener('click', () => window.print());

// ── 처음부터 ──
resetBtn.addEventListener('click', () => {
  if (students.length > 0 && !confirm('지금까지 작업을 모두 지웁니다. 계속하시겠어요?')) return;
  students = [];
  namesEl.value = '';
  numGroups = 4;
  numValueEl.textContent = '4';
  decBtn.disabled = false;
  incBtn.disabled = false;
  updateNameCount();
  render();
  showToast('처음 상태로 돌렸습니다.');
});

// ── 유틸 ──
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── 초기 렌더 ──
render();
initPoolSortable();
updateNameCount();
</script>
</body>
</html>
