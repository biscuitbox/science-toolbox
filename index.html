<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과학 도구상자</title>
  <meta name="description" content="학생과 교사를 위한 과학 학습 도구 모음">

  <!-- 화면 모드(칠판 화면)를 그림이 그려지기 전에 먼저 적용해 깜빡임을 막습니다 -->
  <script>
    try { if (localStorage.getItem('boardMode') === 'true') document.documentElement.dataset.theme = 'board'; } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#content">도구 목록으로 바로 가기</a>

  <!-- ===== 첫 화면: 제목 + 도구 주기율표 ===== -->
  <header class="hero container" id="top">
    <div class="hero-text">
      <h1 class="site-title">과학 도구상자</h1>
      <p class="site-intro">가상실험, 계산기, 수업 도구를 분야별로 모았어요.<br>
        도구 표의 칸을 누르면 그 도구 설명으로 바로 이동해요.</p>
      <p class="site-count" id="site-count" aria-live="polite"></p>
    </div>

    <nav class="ptable-wrap" aria-label="도구 표 — 분야별 도구 바로가기">
      <div class="ptable" id="ptable"><!-- app.js가 채움 --></div>
      <p class="ptable-legend">
        <span class="legend-item"><span class="legend-box"></span>쓸 수 있는 도구</span>
        <span class="legend-item"><span class="legend-box is-ghost"></span>준비 중</span>
      </p>
    </nav>
  </header>

  <!-- ===== 찾기 막대: 검색 · 학년 · 보기 설정 ===== -->
  <div class="toolbar" id="toolbar">
    <div class="container toolbar-inner">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" id="search" placeholder="도구 이름, 단원, 성취기준으로 찾기" aria-label="도구 검색" autocomplete="off">
      </div>

      <div class="grade-filter" id="grade-filter" role="radiogroup" aria-label="학년 필터"><!-- app.js가 채움 --></div>

      <div class="switches">
        <label class="switch">
          <input type="checkbox" id="teacher-mode-toggle" role="switch">
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text">교사용 정보</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="board-mode-toggle" role="switch">
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text">칠판 화면</span>
        </label>
      </div>
    </div>
  </div>

  <main class="container" id="content" tabindex="-1">
    <div id="featured"><!-- 추천 도구 영역 --></div>
    <div id="sections">
      <p class="loading">도구를 불러오는 중…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>과학 도구상자 — 학생과 교사를 위한 과학 학습 도구 모음</p>
    </div>
  </footer>

  <a class="to-table" id="to-table" href="#top" aria-label="도구 표로 돌아가기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <span>도구 표</span>
  </a>

  <script src="app.js"></script>
</body>
</html>
