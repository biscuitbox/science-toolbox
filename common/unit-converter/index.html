<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="웹에서 간편하게 사용할 수 있는 과학 범용 단위 변환기입니다. 기본, 물리, 화학, 생명과학, 지구과학 단위 변환 기능을 제공합니다.">
    <title>과학 범용 단위 변환기</title>
    <link rel="stylesheet" href="index.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="../../toolbox-nav.js"></script>
<style>

/* ============================================================
   과학 도구상자 · 도구 공통 틀 v1.1
   - 모든 도구가 같은 머리말·탭·버튼·글꼴·화면 폭을 쓰도록 맞춘 부분입니다.
   - 도구마다 바꾸는 값은 맨 위 --cat(분야 색) 하나뿐입니다.
   - 이 블록(공통 틀 시작~끝)은 도구끼리 똑같이 복사해 씁니다.
     도구만의 디자인은 "공통 틀 끝" 아래에 따로 적습니다.
   ============================================================ */
:root {
  /* 분야 색: 물리 #1D4ED8 · 화학 #B45309 · 생명 #15803D · 지구 #78350F · 메이커 #BE123C · 공통 #57534E · 학급 #6D28D9 */
  --cat: #57534E;   /* 공통 도구 */
  --cat-soft: color-mix(in srgb, var(--cat) 9%, var(--sheet));

  --paper:    #F6F2E7;
  --sheet:    #FFFDF7;
  --ink:      #24211D;
  --graphite: #5C564E;
  --hairline: #D9D1BF;
  --rule:     rgba(64, 106, 168, 0.11);
  --focus:    #1D4ED8;

  --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', system-ui, sans-serif;
  --font-display: 'Gowun Batang', 'Pretendard', serif;
  --radius: 4px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(to bottom, transparent calc(2rem - 1px), var(--rule) calc(2rem - 1px));
  background-size: 100% 2rem;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* 화면 폭: 홈페이지와 같은 1200px. 위쪽 여백은 "← 도구상자" 링크 자리 */
.tb-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 4.25rem 1.5rem 3rem;
}

/* ----- 머리말: 분야·학년·활동 → 제목 → 한 줄 설명 ----- */
.tb-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 1.1rem;
  align-items: center;
  padding-bottom: 1.25rem;
  margin-bottom: 1.25rem;
  border-bottom: 1.5px solid var(--ink);
}
.tb-emblem {
  grid-row: 1 / span 3;
  align-self: start;
  display: grid;
  place-items: center;
  width: 4.25rem;
  height: 4.25rem;
  margin-top: .2rem;
  border: 1.5px solid var(--ink);
  border-top: 6px solid var(--cat);
  border-radius: var(--radius);
  background: var(--cat-soft);
  color: var(--cat);
  box-shadow: 4px 4px 0 color-mix(in srgb, var(--cat) 28%, transparent);
}
.tb-emblem svg { width: 2.6rem; height: 2.6rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .3rem .9rem;
  margin: 0;
  font-size: .9rem;
  font-weight: 600;
  color: var(--graphite);
}
.tb-meta .tb-cat {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  color: var(--cat);
  font-weight: 700;
}
.tb-meta .tb-cat svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb-title {
  margin: .15rem 0 .3rem;
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 4.2vw, 2.6rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  word-break: keep-all;
}
.tb-lead {
  margin: 0;
  font-size: 1.02rem;
  color: var(--graphite);
  word-break: keep-all;
}
.tb-lead b, .tb-lead strong { color: var(--ink); }

/* ----- 교사용 정보: 학생 화면에서는 접혀 있음 ----- */
.tb-teacher {
  margin: 0 0 1.25rem;
  border: 1.5px dashed var(--graphite);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--ink) 3%, var(--paper));
}
.tb-teacher > summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4rem .8rem;
  padding: .6rem .9rem;
  cursor: pointer;
  font-weight: 700;
  font-size: .95rem;
  list-style: none;
}
.tb-teacher > summary::-webkit-details-marker { display: none; }
.tb-teacher > summary::before {
  content: '';
  width: .55rem; height: .55rem;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(-45deg);
  transition: transform .3s var(--ease);
}
.tb-teacher[open] > summary::before { transform: rotate(45deg); }
.tb-teacher > summary .tb-hint { font-weight: 500; color: var(--graphite); font-size: .88rem; }
.tb-teacher-body { max-width: 62rem; padding: 0 1rem 1rem; font-size: .95rem; word-break: keep-all; }
.tb-teacher-body ul { margin: .4rem 0 0; padding-left: 1.2rem; }
.tb-teacher-body li { margin-bottom: .4rem; }
.tb-std {
  display: inline-block;
  padding: .05rem .5rem;
  font-weight: 700;
  font-size: .9rem;
  color: var(--cat);
  border: 1.5px solid var(--cat);
  border-radius: 3px;
  background: var(--sheet);
  white-space: nowrap;
}

/* ----- 도구 전체에 걸리는 조작(교사용 보기, 인쇄 등) 한 줄 ----- */
.tb-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .6rem 1.2rem;
  margin: 0 0 1.1rem;
}
/* 켜고 끄는 스위치 — 홈페이지의 '교사용 정보' 스위치와 같은 모양 */
.tb-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  min-height: 40px;
  font-size: .95rem;
  font-weight: 600;
  color: var(--graphite);
  cursor: pointer;
  user-select: none;
}
.tb-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.tb-switch .tb-track {
  position: relative;
  flex-shrink: 0;
  width: 38px;
  height: 22px;
  border: 1.5px solid var(--graphite);
  border-radius: 999px;
  background: var(--sheet);
  transition: background-color .3s var(--ease), border-color .3s var(--ease);
}
.tb-switch .tb-track::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--graphite);
  transition: transform .3s var(--ease), background-color .3s var(--ease);
}
.tb-switch input:checked + .tb-track { background: var(--ink); border-color: var(--ink); }
.tb-switch input:checked + .tb-track::after { transform: translateX(16px); background: var(--paper); }
.tb-switch:has(input:checked) { color: var(--ink); }
.tb-switch input:focus-visible + .tb-track { outline: 3px solid var(--focus); outline-offset: 3px; }

/* ----- 화면 바꾸기 탭: 한 덩어리 버튼 묶음 ----- */
.tb-tabs {
  display: inline-flex;
  flex-wrap: wrap;
  margin: 0 0 1rem;
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--sheet);
}
.tb-tabs > button {
  margin: 0;
  border-radius: 0;
  box-shadow: none;
  font: inherit;
  font-size: .98rem;
  min-height: 44px;
  padding: .5rem 1.1rem;
  border: 0;
  border-left: 1px solid var(--hairline);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background-color .3s var(--ease), color .3s var(--ease);
}
.tb-tabs > button:first-child { border-left: 0; }
.tb-tabs > button:hover { background: color-mix(in srgb, var(--ink) 7%, var(--sheet)); }
.tb-tabs > button[aria-selected="true"],
.tb-tabs > button.active { background: var(--ink); color: var(--paper); font-weight: 700; }
.tb-tabs > button:focus-visible { outline-offset: -4px; }

/* ----- 실험 무대(그림·캔버스가 들어가는 틀) ----- */
.tb-stage {
  position: relative;
  background: var(--sheet);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  box-shadow: 5px 5px 0 color-mix(in srgb, var(--cat) 26%, transparent);
  overflow: hidden;
}

/* ----- 조작판(버튼·슬라이더가 모인 곳) ----- */
.tb-panel {
  background: var(--sheet);
  border: 1.5px solid var(--hairline);
  border-radius: var(--radius);
  padding: 1rem;
}
.tb-panel-title {
  margin: 0 0 .7rem;
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
}

/* ----- 버튼 ----- */
.tb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  min-height: 42px;
  padding: .5rem 1rem;
  font: inherit;
  font-size: .95rem;
  font-weight: 700;
  color: var(--sheet);
  background: var(--cat);
  border: 1.5px solid var(--cat);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background-color .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease);
}
.tb-btn:hover { background: color-mix(in srgb, var(--cat) 82%, var(--ink)); }
.tb-btn.ghost, .tb-btn--ghost {
  color: var(--ink);
  background: var(--sheet);
  border-color: var(--ink);
  font-weight: 600;
}
.tb-btn.ghost:hover, .tb-btn--ghost:hover { background: var(--cat-soft); }
.tb-btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ----- 안내 상자 ----- */
.tb-note {
  margin: 0;
  padding: .8rem 1rem;
  background: var(--cat-soft);
  border-left: 5px solid var(--cat);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: .97rem;
  word-break: keep-all;
}
.tb-note b, .tb-note strong { color: color-mix(in srgb, var(--cat) 70%, var(--ink)); }

/* ----- 출처 ----- */
.tb-foot {
  margin-top: 2.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--hairline);
  font-size: .85rem;
  color: var(--graphite);
}

/* ----- 화면 크기별 ----- */
@media (max-width: 640px) {
  .tb-wrap { padding: 3.75rem 1rem 2.5rem; }
  .tb-head { column-gap: .8rem; }
  .tb-emblem { width: 3.3rem; height: 3.3rem; border-top-width: 5px; }
  .tb-emblem svg { width: 2rem; height: 2rem; }
  /* 휴대폰: 탭을 같은 폭으로 한 줄에 */
  .tb-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
  .tb-tabs > button { padding: .4rem .35rem; font-size: .88rem; line-height: 1.3; word-break: keep-all; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; animation-iteration-count: 1 !important; }
}
@media print {
  body { background: #fff; }
  .tb-wrap { padding: 0; max-width: none; }
  .tb-tabs, .tb-teacher, .tb-actions, .toolbox-back-link { display: none !important; }
  .tb-stage { box-shadow: none; break-inside: avoid; }
  .tb-emblem { box-shadow: none; }
}
/* ===== 공통 틀 끝 ===== */

/* ===== 공통 틀 맞춤: 단위 변환기 ===== */
:root { --bg-main: var(--paper); --bg-secondary: color-mix(in srgb, var(--ink) 5%, var(--sheet)); --bg-card: var(--sheet); --text-main: var(--ink); --text-muted: var(--graphite); --border-color: var(--hairline); --accent: var(--ink); --accent-hover: var(--ink); }
body { display: block; min-height: 0; padding: 0; }
.container { max-width: none; }
/* 변환기 카드가 이 도구의 실험 무대 */
.converter-card { padding: 1.4rem; border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: 5px 5px 0 color-mix(in srgb, var(--cat) 30%, transparent); }
.converter-card:hover { transform: none; border-color: var(--ink); box-shadow: 5px 5px 0 color-mix(in srgb, var(--cat) 30%, transparent); }
.domain-selector select, .input-group input, .input-group select { border: 1.5px solid var(--hairline); border-radius: var(--radius); min-height: 48px; }
.domain-selector select:focus, .input-group input:focus, .input-group select:focus { border-color: var(--ink); }
.tab-btn { border-radius: var(--radius); border: 1.5px solid var(--hairline); background: var(--sheet); color: var(--ink); min-height: 40px; }
.tab-btn:hover { background: var(--cat-soft); }
.tab-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.input-group input { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.input-group input[readonly] { color: var(--ink); background: var(--cat-soft); cursor: default; }
.formula-box { background: var(--cat-soft); border: 0; border-left: 5px solid var(--cat); border-radius: 0 var(--radius) var(--radius) 0; }
.formula-box h4 { font-family: var(--font-display); font-size: 1.1rem; }
.formula-text { color: var(--ink); }
.calc-process { border-radius: var(--radius); }
/* 넓은 화면: 왼쪽 변환, 오른쪽 공식 설명 */
@media (min-width: 1000px) {
  .converter-card { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); column-gap: 1.75rem; align-items: start; }
  .converter-card > * { grid-column: 1; }
  .converter-card > .formula-box { grid-column: 2; grid-row: 1 / span 3; }
}
</style>
</head>
<body>
    <div class="tb-wrap">
    <header class="tb-head">
    <div class="tb-emblem" aria-hidden="true">
      <svg viewBox="0 0 48 48"><rect x="4" y="15" width="40" height="18" rx="2"/><path d="M10 15v6M16 15v9M22 15v6M28 15v9M34 15v6M40 15v9"/><path d="M14 40h20M30 36l4 4-4 4M18 8H14M18 4l-4 4 4 4" /></svg>
    </div>
    <p class="tb-meta">
      <span class="tb-cat"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3M10 8v4.5M14 8v3M18 8v4.5"/></svg>공통 도구</span>
      <span>전 학년</span><span>계산기</span>
    </p>
    <h1 class="tb-title">과학 범용 단위 변환기</h1>
    <p class="tb-lead">길이와 질량부터 힘, 몰 농도, 기압까지 여러 분야의 과학 단위를 바꾸고 계산 과정을 확인해요.</p>
  </header>

    <main class="container">
        <div class="converter-card">
            
            <div class="domain-selector">
                <select id="domainSelect" aria-label="과학 분야 선택">
                    <option value="basic">📏 기본 변환 (길이, 질량 등)</option>
                    <option value="physics">⚙️ 물리 변환 (속도, 힘 등)</option>
                    <option value="chemistry">🧪 화학 변환 (몰, 농도 등)</option>
                    <option value="biology">🧬 생명과학 변환 (세포 크기 등)</option>
                    <option value="earth">🌍 지구과학 변환 (기압, 천문 등)</option>
                </select>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <!-- Tabs will be dynamically inserted here -->
            </div>

            <div class="converter-body">
                <div class="input-group">
                    <label for="inputValue" class="sr-only">입력 값</label>
                    <input type="number" id="inputValue" placeholder="값을 입력하세요" value="1" />
                    <label for="inputUnit" class="sr-only">입력 단위</label>
                    <select id="inputUnit"></select>
                </div>

                <div class="equals-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M19 12l-7 7-7-7" />
                    </svg>
                </div>

                <div class="input-group">
                    <label for="outputValue" class="sr-only">결과 값</label>
                    <input type="number" id="outputValue" placeholder="결과" readonly />
                    <label for="outputUnit" class="sr-only">결과 단위</label>
                    <select id="outputUnit"></select>
                </div>
            </div>

            <div class="formula-box" id="formulaBox">
                <h4>💡 변환 공식 및 이해</h4>
                <p id="formulaText" class="formula-text"></p>
                <div id="calcProcess" class="calc-process"></div>
            </div>
            
        </div>
    </main>
    <footer class="tb-foot">단위 환산값과 공식은 직접 정리한 것입니다.</footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
